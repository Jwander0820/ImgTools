<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ImgTools｜本機影像工作桌</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232452c7'/%3E%3Cpath d='M7 9h18v14H7zm3 10 4-4 3 3 2-2 3 3' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workbench">跳到目前工具</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="ImgTools 首頁">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 8.5h20v15H6zM10 19l4-4.5 3.2 3.6 2.3-2.7 3.5 4M21 12h.01"/></svg>
        </span>
        <span><strong>ImgTools</strong><small>本機影像工作桌</small></span>
      </a>
      <div class="topbar-controls">
        <div class="global-setting">
          <span class="setting-label">預設檔名</span>
          <div id="output-naming" class="naming-switch" role="group" aria-label="所有工具的預設輸出檔名">
            <button type="button" data-output-naming="fixed" aria-pressed="true">
              <strong>統一命名</strong><code>output.ext</code>
            </button>
            <button type="button" data-output-naming="source" aria-pressed="false">
              <strong>跟隨來源</strong><code>原始檔名.ext</code>
            </button>
          </div>
        </div>
        <div class="server-state" title="檔案不會上傳到網路">
          <span aria-hidden="true"></span>
          <div><strong>Local server</strong><small>檔案留在這台電腦</small></div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="tool-shelf" aria-label="完整工具庫">
        <div class="shelf-heading">
          <p class="eyebrow">Tool library</p>
          <div class="shelf-title"><h2>所有工具</h2><span id="tool-count">0</span></div>
          <label class="search-box" for="tool-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
            <input id="tool-search" type="search" placeholder="搜尋工具名稱或指令" autocomplete="off">
          </label>
          <div id="category-filters" class="category-filters" aria-label="工具分類"></div>
        </div>
        <nav id="tools" class="tools"></nav>
        <div id="tools-empty" class="empty-state" hidden>
          <strong>找不到工具</strong>
          <span>換個關鍵字或切回全部分類。</span>
        </div>
      </aside>

      <section class="studio">
        <section class="quickstart" aria-labelledby="quick-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Quick strip</p>
              <h1 id="quick-title">常用功能，直接開始</h1>
            </div>
            <p>只填來源就能輸出；檔名與位置可之後再調整。</p>
          </div>
          <div id="quick-actions" class="quick-actions" aria-label="常用功能"></div>
        </section>

        <div class="task-grid">
          <section id="workbench" class="workbench" aria-labelledby="tool-title">
            <div id="tool-intro" class="tool-intro">
              <div>
                <div class="tool-kicker"><span id="tool-category">—</span><span id="danger-badge"></span></div>
                <h2 id="tool-title">載入工具中…</h2>
                <p id="tool-description">正在讀取本機工具清單。</p>
              </div>
              <code id="tool-action">—</code>
            </div>
            <form id="form" class="tool-form"></form>
          </section>

          <aside class="output-drawer" aria-label="執行結果">
            <div class="output-heading">
              <div><p class="eyebrow">Latest run</p><h2>執行結果</h2></div>
              <span id="status" class="status idle" role="status"><i></i>等待執行</span>
            </div>
            <div id="result-summary" class="result-summary" aria-live="polite">
              <div class="result-placeholder">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7.5h22v17H5zM9 20l4.5-5 3.5 4 2.5-3 3.5 4M21.5 12h.01"/></svg>
                <strong>準備好就開始處理</strong>
                <span>完成後，輸出檔案與可複製路徑會出現在這裡。</span>
              </div>
            </div>
            <p id="manifest-note" class="manifest-note" hidden></p>
            <details class="raw-result">
              <summary>開發資訊與原始 JSON</summary>
              <pre id="result">{}</pre>
            </details>
          </aside>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
